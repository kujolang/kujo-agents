[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kujo-agents-videoops"
version = "0.3.0"
description = "Repository-owned production media, audio QA and review tools for Kujo Agents"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.scripts]
videoops = "videoops.cli:main"

[tool.setuptools.packages.find]
include = ["videoops*"]

[tool.setuptools.package-data]
videoops = ["schemas/*.json"]
